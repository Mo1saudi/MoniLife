name: Build OMNI LIFE Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Write Firebase configuration for this build only
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          trap 'rm -f google-services.json' EXIT
          pnpm exec expo prebuild --platform android --clean --no-install

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          text = path.read_text()
          marker = "    signingConfigs {\n"
          signing = "    signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword System.getenv('ANDROID_SIGNING_PASSWORD')\n            keyAlias 'omnilife-release'\n            keyPassword System.getenv('ANDROID_SIGNING_PASSWORD')\n        }\n"
          if marker not in text:
              raise SystemExit('signingConfigs marker not found')
          text = text.replace(marker, signing, 1)
          old = "            signingConfig signingConfigs.debug\n            def enableShrinkResources"
          new = "            signingConfig signingConfigs.release\n            def enableShrinkResources"
          if old not in text:
              raise SystemExit('release signing line not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Build release APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OmniLifeCenter-1.0.79-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
